                    حمزة بن عبد المطلب رضي الله عنه هو عم رسول الله ﷺ،
                    وأحد كبار صحابته ومن السابقين إلى الإسلام. عُرف
                    بالشجاعة والقوة والثبات، وكان من المدافعين عن رسول
                    الله ﷺ. شارك في غزوة بدر، واستشهد رضي الله عنه في
                    غزوة أحد، واشتهر بلقب أسد الله وأسد رسوله.
